<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — TaskFlow</title>
  <meta name="description" content="Reset your TaskFlow account password securely.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      background: var(--bg-app);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 2.25rem 2rem;
      box-shadow: var(--shadow-xl);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div style="position: absolute; top: 1.5rem; right: 1.5rem;">
      <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Theme"></button>
    </div>

    <div class="auth-card">
      <div class="auth-header">
        <div style="display: inline-flex; align-items: center; gap: 0.65rem; margin-bottom: 1rem;">
          <div class="brand-icon">TF</div>
          <span class="brand-name" style="font-size: 1.25rem;">TaskFlow</span>
        </div>
        <h2 style="font-size: 1.35rem; margin-bottom: 0.35rem;">Reset Password</h2>
        <p style="font-size: 0.875rem;" id="resetSubtitle">Enter your email to receive recovery instructions</p>
      </div>

      <!-- Request Reset Email Form -->
      <form id="requestResetForm">
        <div class="form-group">
          <label class="form-label" for="resetEmail">Email Address <span class="required">*</span></label>
          <input
            type="email"
            id="resetEmail"
            class="form-control"
            placeholder="alex@company.com"
            required
            autocomplete="email"
          />
        </div>

        <button type="submit" id="submitResetBtn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
          Send Reset Instructions
        </button>
      </form>

      <!-- New Password Form (Only shown if token present in URL hash) -->
      <form id="updatePasswordForm" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="newPassword">New Password <span class="required">*</span></label>
          <input
            type="password"
            id="newPassword"
            class="form-control"
            placeholder="Minimum 6 characters"
            required
            minlength="6"
          />
        </div>

        <button type="submit" id="submitUpdateBtn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
          Update Password
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-muted);">
        Remembered your password? <a href="/login.html" style="font-weight: 600;">Back to login</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash;
      const requestForm = document.getElementById('requestResetForm');
      const updateForm = document.getElementById('updatePasswordForm');
      const subtitle = document.getElementById('resetSubtitle');

      // Check if arriving from Supabase recovery redirect
      if (hash && hash.includes('type=recovery')) {
        requestForm.style.display = 'none';
        updateForm.style.display = 'block';
        subtitle.innerText = 'Please create a new password for your account';
      }

      requestForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('resetEmail').value.trim();
        const btn = document.getElementById('submitResetBtn');

        btn.disabled = true;
        btn.innerText = 'Sending...';

        try {
          await resetPassword(email);
          showToast('✓ Reset link dispatched! Check your email inbox.', 'success', 5000);
          btn.innerText = 'Link Sent';
        } catch (err) {
          showToast(err.message || 'Unable to send password reset', 'error');
          btn.disabled = false;
          btn.innerText = 'Send Reset Instructions';
        }
      });

      updateForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const newPassword = document.getElementById('newPassword').value;
        const btn = document.getElementById('submitUpdateBtn');

        if (newPassword.length < 6) {
          showToast('Password must be at least 6 characters', 'warning');
          return;
        }

        btn.disabled = true;
        btn.innerText = 'Updating...';

        try {
          await updatePassword(newPassword);
          showToast('✓ Password updated! You can now log in.', 'success');
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 1500);
        } catch (err) {
          showToast(err.message || 'Failed to update password', 'error');
          btn.disabled = false;
          btn.innerText = 'Update Password';
        }
      });
    });
  </script>
</body>
</html>
